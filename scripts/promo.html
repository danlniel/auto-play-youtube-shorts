<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 800px; overflow: hidden;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(150deg, #1a1a1f 0%, #2a1218 100%);
    display: flex; align-items: center; justify-content: center; gap: 90px;
    color: #fff;
  }
  .icon {
    width: 260px; height: 260px; border-radius: 56px;
    background: linear-gradient(180deg, #ff2846 0%, #c8002d 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 30px 80px rgba(255, 40, 70, .35);
    flex-shrink: 0;
  }
  .tri {
    width: 0; height: 0;
    border-left: 62px solid transparent;
    border-right: 62px solid transparent;
    border-top: 104px solid #fff;
    margin-top: 14px;
  }
  .text { max-width: 620px; }
  h1 { font-size: 54px; font-weight: 800; letter-spacing: -1px; line-height: 1.1; }
  h1 .red { color: #ff2846; }
  p.tag { font-size: 26px; color: #c9c9d1; margin-top: 22px; line-height: 1.45; }
  ul { list-style: none; margin-top: 34px; }
  li { font-size: 21px; color: #e8e8ee; margin-top: 14px; display: flex; align-items: center; }
  li::before {
    content: ""; width: 10px; height: 10px; border-radius: 50%;
    background: #ff2846; margin-right: 16px; flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="icon"><div class="tri"></div></div>
  <div class="text">
    <h1>Auto Play <span class="red">Shorts</span></h1>
    <p class="tag">Hands-free Shorts watching. When the current Short ends, the next one starts automatically.</p>
    <ul>
      <li>Detects the end of every Short — no more endless looping</li>
      <li>One-click on/off toggle in the toolbar</li>
      <li>No data collection, no tracking, zero setup</li>
    </ul>
  </div>
</body>
</html>
